schema_version = "1.3"
multi_step_reward_strategy = "mean"

[environment]
build_timeout_sec = 300.0

[[steps]]
name = "seed"
min_reward = 1.0

[steps.agent]
timeout_sec = 600.0

[steps.verifier]
timeout_sec = 60.0

[[steps]]
name = "recall"
min_reward = 1.0

[steps.agent]
timeout_sec = 900.0

[steps.verifier]
timeout_sec = 60.0
