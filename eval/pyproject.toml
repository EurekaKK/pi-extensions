[project]
name = "pi-eval-harness"
version = "0.1.0"
description = "Configurable Harbor TUI adapter for Pi and pi-extensions"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
    "harbor==0.20.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<10",
    "ruff>=0.12,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["pi_eval_harness"]
