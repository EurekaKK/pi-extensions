job_name: dev16-pi-tui-four-ext-probe2
jobs_dir: runs/dev16
n_attempts: 1
n_concurrent_trials: 2
agents:
  - import_path: pi_eval_harness.agent:PiTuiAgent
    model_name: opencode-go/deepseek-v4-flash
    extra_allowed_hosts:
      - opencode.ai
    kwargs:
      thinking: max
      extensions:
        - todo
        - goal
        - sub-agent
        - context-management
environment:
  mounts:
    - type: bind
      source: "${PI_EVAL_MODEL_KEY_FILE}"
      target: /run/secrets/pi-eval-model-api-key
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: "${PI_EVAL_RUNTIME_DIR}"
      target: /opt/pi-eval/runtime
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: "${PI_EVAL_EXTENSIONS_DIR}"
      target: /opt/pi-extension-repo/extensions
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: "${PI_EVAL_PACKAGES_DIR}"
      target: /opt/pi-extension-repo/packages
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: "${PI_EVAL_REPO_SCRIPTS_DIR}"
      target: /opt/pi-extension-repo/scripts
      read_only: true
      bind:
        create_host_path: false
datasets:
  - name: terminal-bench/terminal-bench-2-1
    ref: sha256:7d7bdc1cbedad549fc1140404bd4dc45e5fd0ea7c4186773687d177ad3a0699a
    task_names:
      - terminal-bench/extract-elf
      - terminal-bench/pypi-server
