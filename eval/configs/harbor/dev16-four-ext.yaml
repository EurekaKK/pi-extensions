job_name: dev16-pi-tui-four-ext
jobs_dir: runs/dev16
n_attempts: 1
n_concurrent_trials: 2
agents:
  - import_path: pi_eval_harness.agent:PiTuiAgent
    model_name: opencode-go/deepseek-v4-flash
    extra_allowed_hosts:
      - opencode.ai
    kwargs:
      thinking: max
      extensions:
        - todo
        - goal
        - sub-agent
        - context-management
environment:
  mounts:
    - type: bind
      source: "${PI_EVAL_MODEL_KEY_FILE}"
      target: /run/secrets/pi-eval-model-api-key
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: "${PI_EVAL_RUNTIME_DIR}"
      target: /opt/pi-eval/runtime
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: "${PI_EVAL_EXTENSIONS_DIR}"
      target: /opt/pi-extensions
      read_only: true
      bind:
        create_host_path: false
datasets:
  - name: terminal-bench/terminal-bench-2-1
    ref: sha256:7d7bdc1cbedad549fc1140404bd4dc45e5fd0ea7c4186773687d177ad3a0699a
    task_names:
      - terminal-bench/configure-git-webserver
      - terminal-bench/extract-elf
      - terminal-bench/feal-differential-cryptanalysis
      - terminal-bench/hf-model-inference
      - terminal-bench/install-windows-3.11
      - terminal-bench/kv-store-grpc
      - terminal-bench/llm-inference-batching-scheduler
      - terminal-bench/mcmc-sampling-stan
      - terminal-bench/merge-diff-arc-agi-task
      - terminal-bench/modernize-scientific-stack
      - terminal-bench/multi-source-data-merger
      - terminal-bench/password-recovery
      - terminal-bench/polyglot-c-py
      - terminal-bench/pypi-server
      - terminal-bench/schemelike-metacircular-eval
      - terminal-bench/train-fasttext
