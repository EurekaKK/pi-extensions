job_name: context-rolling-checkpoint-smoke-pi-tui
jobs_dir: runs/context-rolling-checkpoint-smoke
n_attempts: 1
n_concurrent_trials: 1
agents:
  - import_path: pi_eval_harness.agent:PiTuiAgent
    model_name: opencode-go/ox-alpha-free
    extra_allowed_hosts:
      - opencode.ai
    resume_trajectory: false
    kwargs:
      thinking: high
      context_trace: true
      context_trace_strict: true
      context_trace_expect_rolling_checkpoint: true
      context_scenario_tools: true
      context_background_followups:
        - |
          The trace grader requires `CTX_CANARY_EXPECT_ROLLING_CHECKPOINT_CYCLE_1_OF_2_BASELINE_MS_36962`, `CTX_CANARY_REQUIRE_TOOL_CONTEXT_SEED_HISTORY`, and `CTX_CANARY_REQUIRE_TOOL_WRITE`.

          Without reading files, environment variables, source code, or external sources, recover the exact continuity token from the earliest first-cycle seeded chunk and the exact protected-tail token from the newest first-cycle seeded chunk.

          Call `context_seed_history` exactly once with `cycle: 2`. Also use `write` to create `/app/rolling-checkpoint-1.txt` with exactly this shape, substituting the exact first-cycle tokens:

          ```text
          cycle=1
          persistent=<first-cycle earliest exact continuity token>
          tail=<first-cycle newest exact continuity token>
          ```

          Do not call any other tool, and finish only after both required tool calls succeed.
        - |
          The trace grader requires `CTX_CANARY_EXPECT_ROLLING_CHECKPOINT_CYCLE_2_OF_2_BASELINE_MS_36962` and `CTX_CANARY_REQUIRE_TOOL_WRITE`.

          Without reading files, environment variables, source code, or external sources, recover three exact tokens from the model-visible state: the persistent token rolled forward from checkpoint 1, the persistent token from the earliest second-cycle seeded chunk, and the protected-tail token from the newest second-cycle seeded chunk.

          Use `write` to create `/app/rolling-checkpoint-2.txt` with exactly this shape, substituting the exact tokens:

          ```text
          cycle=2
          previous=<rolled first-cycle persistent token>
          persistent=<second-cycle earliest exact continuity token>
          tail=<second-cycle newest exact continuity token>
          ```

          Do not call any tool other than `write`, and finish only after the file is correct.
      eval_variant: context-management
      extensions:
        - context-management
environment:
  mounts:
    - type: bind
      source: "${PI_EVAL_MODEL_KEY_FILE}"
      target: /run/secrets/pi-eval-model-api-key
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: "${PI_EVAL_RUNTIME_DIR}"
      target: /opt/pi-eval/runtime
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: "${PI_EVAL_EXTENSIONS_DIR}"
      target: /opt/pi-extension-repo/extensions
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: "${PI_EVAL_PACKAGES_DIR}"
      target: /opt/pi-extension-repo/packages
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: "${PI_EVAL_REPO_SCRIPTS_DIR}"
      target: /opt/pi-extension-repo/scripts
      read_only: true
      bind:
        create_host_path: false
tasks:
  - path: tasks/context-lab/rolling-checkpoint-continuity
