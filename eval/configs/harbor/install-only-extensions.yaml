job_name: install-only-pi-tui-extensions
jobs_dir: runs/install-only
install_only: true
n_attempts: 1
n_concurrent_trials: 1
agents:
  - import_path: pi_eval_harness.agent:PiTuiAgent
    model_name: deepseek/deepseek-v4-flash
    kwargs:
      thinking: high
      extensions:
        - context-management
        - todo
        - sub-agent
environment:
  mounts:
    - type: bind
      source: "${PI_EVAL_EXTENSIONS_DIR}"
      target: /opt/pi-extension-repo/extensions
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: "${PI_EVAL_PACKAGES_DIR}"
      target: /opt/pi-extension-repo/packages
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: "${PI_EVAL_REPO_SCRIPTS_DIR}"
      target: /opt/pi-extension-repo/scripts
      read_only: true
      bind:
        create_host_path: false
datasets:
  - name: terminal-bench/terminal-bench-2-1
    ref: sha256:7d7bdc1cbedad549fc1140404bd4dc45e5fd0ea7c4186773687d177ad3a0699a
    task_names:
      - terminal-bench/cancel-async-tasks
